<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>For Messu ✨</title>
    <meta name="description" content="A magical cinematic intro"/>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000;
            overflow: hidden;
            min-height: 100dvh; 
            font-family: 'Pacifico', cursive;
            color: white;
        }

        /* ====== STEP 1: VIDEO INTRO ====== */
        #step-video {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: opacity 1.2s ease;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            inset: 0;
            background: #000;
        }

        #welcome-screen {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 24px;
            text-align: center;
            background:
                radial-gradient(circle at 50% 35%, rgba(255, 215, 120, 0.26), transparent 32%),
                linear-gradient(145deg, #120d24 0%, #2a1636 48%, #100b20 100%);
            transition: opacity 0.7s ease;
        }

        .welcome-kicker {
            color: #ffd978;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .welcome-title {
            max-width: 760px;
            color: #fff8df;
            font-family: 'Pacifico', cursive;
            font-size: clamp(2.5rem, 9vw, 6.5rem);
            line-height: 1.15;
            text-shadow: 0 0 30px rgba(255, 215, 120, 0.3);
        }

        .welcome-button {
            border: 1px solid rgba(255, 235, 170, 0.65);
            border-radius: 999px;
            padding: 16px 30px;
            color: #2b1734;
            background: linear-gradient(135deg, #ffe9a8, #ffc968);
            box-shadow: 0 12px 35px rgba(255, 201, 104, 0.28);
            cursor: pointer;
            font: 800 0.95rem 'Pacifico', cursive;
            letter-spacing: 0.04em;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .welcome-button:hover,
        .welcome-button:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 16px 42px rgba(255, 201, 104, 0.42);
        }

        #intro-video.is-playing {
            z-index: 1;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.2) 0%,
                rgba(0,0,0,0.05) 40%,
                rgba(0,0,0,0.05) 60%,
                rgba(0,0,0,0.5) 100%
            );
            z-index: 2;
        }

        .video-caption {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 0 30px rgba(255,215,0,0.5),
                0 0 60px rgba(255,215,0,0.3),
                0 4px 20px rgba(0,0,0,0.8);
            letter-spacing: 6px;
            opacity: 0;
            animation: captionAppear 2s ease 0.8s forwards;
            text-align: center;
            white-space: nowrap;
        }

        @keyframes captionAppear {
            0% { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.9); letter-spacing: 2px; }
            60% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.05); letter-spacing: 8px; }
            100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); letter-spacing: 6px; }
        }

        /* Pulsing glow behind caption */
        .caption-glow {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 120px;
            background: radial-gradient(ellipse, rgba(255,215,0,0.15) 0%, transparent 70%);
            z-index: 5;
            animation: glowPulse 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.15); }
        }

        .tap-continue {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 1s ease 3s forwards, subtlePulse 2s ease-in-out 3s infinite;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes subtlePulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ====== STEP 2: KAHAN HOOOO TEXT ====== */
        #step-text {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        /* Particle canvas for step 2 */
        #particle-canvas {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .kahan-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 10vw, 6rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 0 40px rgba(255,215,0,0.4),
                0 0 80px rgba(255,215,0,0.2);
            letter-spacing: 4px;
            text-align: center;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: scale(0.6);
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            line-height: 1.3;
            padding: 0 20px;
        }

        .kahan-text.visible {
            opacity: 1;
            transform: scale(1);
        }

        .kahan-subtitle {
            font-family: 'Pacifico', cursive;
            font-size: clamp(1rem, 4vw, 1.8rem);
            color: rgba(255,255,255,0.5);
            margin-top: 16px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.8s;
            position: relative;
            z-index: 10;
        }

        .kahan-subtitle.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .tap-continue-2 {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 1s ease 2s;
            animation: subtlePulse 2s ease-in-out infinite;
        }

        .tap-continue-2.visible {
            opacity: 1;
        }

        /* ====== STEP 3: DIVINE PHOTO REVEAL ====== */
        #step-photo {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        /* Golden divine rays background */
        .divine-rays {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at center, rgba(255,215,0,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 40%, rgba(255,180,0,0.05) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 60%, rgba(255,200,50,0.05) 0%, transparent 40%);
            z-index: 1;
            animation: divineGlow 4s ease-in-out infinite;
        }

        @keyframes divineGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Light beams radiating outward */
        .light-beams {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200vmax;
            height: 200vmax;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
            background: conic-gradient(
                from 0deg,
                transparent 0deg, rgba(255,215,0,0.06) 5deg, transparent 10deg,
                transparent 20deg, rgba(255,215,0,0.04) 25deg, transparent 30deg,
                transparent 40deg, rgba(255,215,0,0.07) 45deg, transparent 50deg,
                transparent 60deg, rgba(255,215,0,0.03) 65deg, transparent 70deg,
                transparent 80deg, rgba(255,215,0,0.06) 85deg, transparent 90deg,
                transparent 100deg, rgba(255,215,0,0.04) 105deg, transparent 110deg,
                transparent 120deg, rgba(255,215,0,0.07) 125deg, transparent 130deg,
                transparent 140deg, rgba(255,215,0,0.05) 145deg, transparent 150deg,
                transparent 160deg, rgba(255,215,0,0.06) 165deg, transparent 170deg,
                transparent 180deg, rgba(255,215,0,0.04) 185deg, transparent 190deg,
                transparent 200deg, rgba(255,215,0,0.07) 205deg, transparent 210deg,
                transparent 220deg, rgba(255,215,0,0.03) 225deg, transparent 230deg,
                transparent 240deg, rgba(255,215,0,0.06) 245deg, transparent 250deg,
                transparent 260deg, rgba(255,215,0,0.05) 265deg, transparent 270deg,
                transparent 280deg, rgba(255,215,0,0.04) 285deg, transparent 290deg,
                transparent 300deg, rgba(255,215,0,0.07) 305deg, transparent 310deg,
                transparent 320deg, rgba(255,215,0,0.03) 325deg, transparent 330deg,
                transparent 340deg, rgba(255,215,0,0.06) 345deg, transparent 360deg
            );
            animation: rotateBeams 20s linear infinite;
        }

        .light-beams.visible {
            opacity: 1;
            transition: opacity 3.5s ease;
        }

        @keyframes rotateBeams {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Photo frame — divine circular glow */
        .divine-photo-container {
            position: relative;
            z-index: 10;
            width: clamp(260px, 70vw, 420px);
            height: clamp(260px, 70vw, 420px);
            opacity: 0;
            transform: scale(0.3);
            transition: all 3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .divine-photo-container.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Outer halo ring */
        .divine-halo {
            position: absolute;
            inset: -30px;
            border-radius: 50%;
            border: 2px solid rgba(255,215,0,0.2);
            box-shadow: 
                0 0 40px rgba(255,215,0,0.15),
                inset 0 0 40px rgba(255,215,0,0.1);
            animation: haloBreath 3s ease-in-out infinite;
        }

        .divine-halo-2 {
            position: absolute;
            inset: -55px;
            border-radius: 50%;
            border: 1px solid rgba(255,215,0,0.1);
            box-shadow: 0 0 60px rgba(255,215,0,0.08);
            animation: haloBreath 4s ease-in-out infinite reverse;
        }

        @keyframes haloBreath {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.06); opacity: 1; }
        }

        .divine-photo-frame {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, rgba(255,215,0,0.7), rgba(255,255,255,0.9), rgba(255,215,0,0.5));
            box-shadow: 
                0 0 50px rgba(255,215,0,0.3),
                0 0 100px rgba(255,215,0,0.15),
                0 0 150px rgba(255,215,0,0.05);
            animation: photoFloat 6s ease-in-out infinite;
        }

        @keyframes photoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .divine-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
        }

        /* Caption below the photo */
        .divine-caption {
            position: relative;
            z-index: 10;
            margin-top: 32px;
            font-family: 'Pacifico', cursive;
            font-size: clamp(1.2rem, 4vw, 2rem);
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 20px rgba(255,215,0,0.4);
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.8s;
        }

        .divine-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Divine sparkle particles */
        .divine-particle {
            position: fixed;
            pointer-events: none;
            z-index: 15;
            font-size: 12px;
            color: rgba(255,215,0,0.8);
            animation: divineFloat 3s ease-in-out forwards;
        }

        @keyframes divineFloat {
            0% { transform: translate(0, 0) scale(0); opacity: 0; }
            20% { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx2), var(--dy2)) scale(0.5); }
        }

        .continue-btn {
            position: relative;
            z-index: 10;
            margin-top: 40px;
            padding: 14px 40px;
            border-radius: 9999px;
            background: rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: white;
            font-family: 'Pacifico', cursive;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease 1.5s, transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .continue-btn.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .continue-btn:hover {
            transform: translateY(-2px) scale(1.05);
            background: rgba(255, 215, 0, 0.25);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        /* White flash for transitions */
        #white-flash {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #white-flash.flash {
            opacity: 1;
        }

        @media (max-width: 767px) {
            .video-caption {
                font-size: clamp(1.5rem, 7vw, 3rem);
                bottom: 100px;
                letter-spacing: 3px;
            }
            .kahan-text {
                font-size: clamp(2rem, 9vw, 4rem);
            }
            .divine-photo-container {
                width: clamp(180px, 60vw, 260px);
                height: clamp(180px, 60vw, 260px);
            }
        }
    </style>
</head>
<body>

<!-- White Flash Overlay -->
<div id="white-flash"></div>

<!-- ====== STEP 1: VIDEO ====== -->
<div id="step-video">
    <video id="intro-video" playsinline preload="auto">
        <source src="didi_video.mp4" type="video/mp4">
    </video>
    <div id="welcome-screen">
        <div class="welcome-kicker">A little surprise for</div>
        <div class="welcome-title">Pariiiii ki Didiiiii 🌟✨</div>
        <button class="welcome-button" id="play-intro" type="button">▶ Play Pari's video</button>
    </div>
    <div class="video-overlay"></div>
    <div class="caption-glow"></div>
    <div class="video-caption" id="video-caption">Diiiiiiiidddddddiiiiiiiiiiiiii</div>
</div>

<!-- ====== STEP 2: KAHAN HOOOO TEXT ====== -->
<div id="step-text">
    <canvas id="particle-canvas"></canvas>
    <div class="kahan-text" id="kahan-text">Kahaaaa<br>Hooooo ??</div>
    <div class="kahan-subtitle" id="kahan-sub">sun rhi ho na... 🥺</div>
</div>

<!-- ====== STEP 3: DIVINE PHOTO REVEAL ====== -->
<div id="step-photo">
    <div class="divine-rays"></div>
    <div class="light-beams" id="light-beams"></div>
    <div class="divine-photo-container" id="photo-container">
        <div class="divine-halo-2"></div>
        <div class="divine-halo"></div>
        <div class="divine-photo-frame">
            <img src="didi_photo.jpeg" alt="Didi" class="divine-photo" id="divine-img"/>
        </div>
    </div>
    <div class="divine-caption" id="divine-caption">Aa gyi pari ki didiiiiii 🌟✨</div>
    <button class="continue-btn" id="continue-btn" onclick="goToHome()">
        ✨ Enter My Little World ✨
    </button>
</div>

<script>
    // Always start fresh
    localStorage.removeItem('musicTime');
    localStorage.removeItem('musicPlaying');

    let currentStep = 0;

    // ====== STEP 1: VIDEO ======
    const stepVideo = document.getElementById('step-video');
    const introVideo = document.getElementById('intro-video');
    const welcomeScreen = document.getElementById('welcome-screen');
    const playIntro = document.getElementById('play-intro');

    playIntro.addEventListener('click', (event) => {
        event.stopPropagation();
        currentStep = 1;
        introVideo.muted = false;
        introVideo.classList.add('is-playing');
        welcomeScreen.style.opacity = '0';
        welcomeScreen.style.pointerEvents = 'none';
        introVideo.play().catch(e => console.log('Video playback blocked', e));
    });

    // Tap advances after the video has started.
    stepVideo.addEventListener('click', () => {
        if (currentStep !== 1) return;
        currentStep = 2;
        introVideo.pause();
        transitionToStep2();
    });

    // Auto-advance when video ends
    introVideo.addEventListener('ended', () => {
        if (currentStep === 1) {
            currentStep = 2;
            transitionToStep2();
        }
    });

    function transitionToStep2() {
        // Flash white
        const flash = document.getElementById('white-flash');
        flash.classList.add('flash');

        setTimeout(() => {
            stepVideo.style.opacity = '0';
            stepVideo.style.pointerEvents = 'none';

            const stepText = document.getElementById('step-text');
            stepText.style.opacity = '1';
            stepText.style.pointerEvents = 'auto';

            flash.classList.remove('flash');

            // Start particle background
            initParticles();

            // Animate text in
            setTimeout(() => {
                document.getElementById('kahan-text').classList.add('visible');
            }, 400);
            setTimeout(() => {
                document.getElementById('kahan-sub').classList.add('visible');
            }, 1200);
        }, 400);
    }

    // ====== STEP 2 → STEP 3 ======
    document.getElementById('step-text').addEventListener('click', () => {
        if (currentStep !== 2) return;
        currentStep = 3;
        transitionToStep3();
    });

    function transitionToStep3() {
        const flash = document.getElementById('white-flash');

        // Golden flash (stronger, divine feel)
        flash.style.background = 'radial-gradient(circle, rgba(255,215,0,0.9) 0%, rgba(255,255,255,1) 60%)';
        flash.classList.add('flash');

        setTimeout(() => {
            document.getElementById('step-text').style.opacity = '0';
            document.getElementById('step-text').style.pointerEvents = 'none';

            const stepPhoto = document.getElementById('step-photo');
            stepPhoto.style.opacity = '1';
            stepPhoto.style.pointerEvents = 'auto';

            flash.classList.remove('flash');

            // Trigger divine reveal sequence — slow & majestic
            setTimeout(() => {
                document.getElementById('light-beams').classList.add('visible');
            }, 500);
            setTimeout(() => {
                document.getElementById('photo-container').classList.add('visible');
                spawnDivineParticles();
            }, 1500);
            setTimeout(() => {
                document.getElementById('divine-caption').classList.add('visible');
            }, 3500);
            setTimeout(() => {
                document.getElementById('continue-btn').classList.add('visible');
            }, 4500);
        }, 600);
    }

    // ====== Divine Particles ======
    function spawnDivineParticles() {
        const symbols = ['✦', '✧', '⋆', '✶', '✴', '❋', '✵'];
        for (let i = 0; i < 40; i++) {
            setTimeout(() => {
                const p = document.createElement('div');
                p.className = 'divine-particle';
                p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                p.style.left = '50%';
                p.style.top = '50%';
                p.style.fontSize = (8 + Math.random() * 16) + 'px';

                const angle = Math.random() * Math.PI * 2;
                const dist1 = 60 + Math.random() * 120;
                const dist2 = 100 + Math.random() * 200;
                p.style.setProperty('--dx', Math.cos(angle) * dist1 + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * dist1 + 'px');
                p.style.setProperty('--dx2', Math.cos(angle) * dist2 + 'px');
                p.style.setProperty('--dy2', (Math.sin(angle) * dist2 - 60) + 'px');

                document.getElementById('step-photo').appendChild(p);
                setTimeout(() => p.remove(), 3000);
            }, i * 80);
        }
    }

    // ====== Particle Canvas for Step 2 ======
    function initParticles() {
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speedY: -(Math.random() * 0.5 + 0.2),
                speedX: (Math.random() - 0.5) * 0.3,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function animate() {
            if (currentStep > 2) return; // stop when leaving step 2
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    // ====== Navigate to Home ======
    function goToHome() {
        const flash = document.getElementById('white-flash');
        flash.style.background = 'white';
        flash.classList.add('flash');
        setTimeout(() => {
            window.location.href = 'home.html';
        }, 500);
    }
</script>
</body>
</html>
