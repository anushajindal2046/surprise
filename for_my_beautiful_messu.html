<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#b60e3d',
            'surface-container': '#f9eaed',
            'surface-container-low': '#fff0f3',
            'surface-container-lowest': '#ffffff',
            'on-surface-variant': '#5a4042'
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            body: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style id="dark-hearts-style">
    html, body { min-height: 100%; margin: 0; background: #000000 !important; }
    #bg-hearts-layer { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;width:100vw;height:100vh; }
    #click-confetti-canvas { position:fixed;inset:0;pointer-events:none;z-index:9999;width:100%;height:100%; }
  
    /* Hearts - gentle float + sway in place */
    @keyframes driftHeart {
      0%   { transform: translate(0,0) rotate(var(--r)) scale(var(--s)); opacity:0; }
      10%  { opacity:var(--op); }
      50%  { transform: translate(var(--dx), calc(var(--dy) * -1)) rotate(calc(var(--r) + 15deg)) scale(var(--s)); opacity:var(--op); }
      90%  { opacity:var(--op); }
      100% { transform: translate(0,0) rotate(var(--r)) scale(var(--s)); opacity:0; }
    }
    .bg-heart {
      position:absolute;
      font-size:var(--sz);
      left:var(--left);
      top:var(--top);
      animation: driftHeart var(--dur) ease-in-out var(--delay) infinite;
      will-change:transform,opacity;
      filter:drop-shadow(0 0 5px rgba(255,100,150,0.7));
    }
  
    /* Balloons - gentle bob in place */
    @keyframes bobBalloon {
      0%,100% { transform: translate(var(--bx), var(--by)) scale(var(--bs)) rotate(calc(var(--br) * -1)); opacity:var(--bop); }
      33%     { transform: translate(calc(var(--bx) + var(--sway)), calc(var(--by) - 18px)) scale(var(--bs)) rotate(0deg); opacity:var(--bop); }
      66%     { transform: translate(calc(var(--bx) - var(--sway)), calc(var(--by) - 10px)) scale(var(--bs)) rotate(var(--br)); opacity:var(--bop); }
    }
    .bg-balloon {
      position:absolute;
      left:var(--bleft);
      top:var(--btop);
      animation: bobBalloon var(--bdur) ease-in-out var(--bdelay) infinite;
      will-change:transform,opacity;
      filter:drop-shadow(0 6px 12px rgba(255,80,130,0.35));
    }
    main, body > div:not(#bg-hearts-layer):not(#click-confetti-canvas) { position: relative; z-index: 1; }
  </style>
  <title>For My Beautiful Messu</title>
</head>
<body class="bg-black text-white font-body relative overflow-x-hidden">
  <div id="bg-hearts-layer" aria-hidden="true"></div>
  <canvas id="click-confetti-canvas"></canvas>
  <script>
  (function(){
    var L=document.getElementById('bg-hearts-layer');
  
    /* ---- Hearts scattered across full page ---- */
    var sy=['\u2665','\u2665','\u2665','\u2764','\u{1F495}','\u{1F496}','\u{1F497}','\u{1F493}'];
    var pc=['#ff69b4','#ff85c2','#ff4d90','#ff1a75','#ffb3d1','#ff6eb4','#ff007f','#ffcce0'];
    for(var i=0;i<40;i++){
      var e=document.createElement('span');
      e.className='bg-heart';
      var sz=(Math.random()*18+8).toFixed(1)+'px';
      var left=(Math.random()*96+1).toFixed(2)+'%';
      var top=(Math.random()*96+1).toFixed(2)+'%';
      var dur=(Math.random()*8+6).toFixed(2)+'s';
      var delay=(-(Math.random()*10)).toFixed(2)+'s';
      var op=(Math.random()*0.55+0.2).toFixed(2);
      var rot=(Math.random()*40-20).toFixed(1)+'deg';
      var sc=(Math.random()*0.5+0.75).toFixed(2);
      var dx=(Math.random()*30-15).toFixed(1)+'px';
      var dy=(Math.random()*25+8).toFixed(1)+'px';
      e.style.cssText='--sz:'+sz+';--left:'+left+';--top:'+top+';--dur:'+dur+';--delay:'+delay+';--op:'+op+';--r:'+rot+';--s:'+sc+';--dx:'+dx+';--dy:'+dy+';color:'+pc[Math.floor(Math.random()*pc.length)]+';';
      e.innerHTML=sy[Math.floor(Math.random()*sy.length)];
      L.appendChild(e);
    }
  
    /* ---- Balloons scattered across full page ---- */
    var balloonColors=[
      ['#FF6B9D','#FF8FAF'],['#FF4D6D','#FF7295'],['#C8BFFF','#A89FFF'],
      ['#FFD166','#FFE08A'],['#A0C4FF','#C5DEFF'],['#CAFFBF','#A8F0A0'],
      ['#FFB3C6','#FF85A1'],['#E8BAFF','#D49AFF']
    ];
    for(var b=0;b<18;b++){
      var wrapper=document.createElement('div');
      wrapper.className='bg-balloon';
      var bleft=(Math.random()*92+1).toFixed(2)+'%';
      var btop=(Math.random()*90+2).toFixed(2)+'%';
      var dur=(Math.random()*5+4).toFixed(2)+'s';
      var delay=(-(Math.random()*8)).toFixed(2)+'s';
      var sc=(Math.random()*0.6+0.4).toFixed(2);
      var op=(Math.random()*0.5+0.25).toFixed(2);
      var sway=(Math.random()*14+6).toFixed(1)+'px';
      var bx=(Math.random()*20-10).toFixed(1)+'px';
      var by=(Math.random()*10-5).toFixed(1)+'px';
      var br=(Math.random()*12-6).toFixed(1)+'deg';
      var col=balloonColors[Math.floor(Math.random()*balloonColors.length)];
      var size=(Math.random()*20+22).toFixed(0);
      wrapper.style.cssText='--bleft:'+bleft+';--btop:'+btop+';--bdur:'+dur+';--bdelay:'+delay+';--bs:'+sc+';--bop:'+op+';--sway:'+sway+';--bx:'+bx+';--by:'+by+';--br:'+br+';';
      wrapper.innerHTML='<svg width="'+size+'" height="'+(size*1.4).toFixed(0)+'" viewBox="0 0 100 140" fill="none" xmlns="http://www.w3.org/2000/svg">'
        +'<defs><radialGradient id="bg'+b+'" cx="36%" cy="30%" r="65%">'
        +'<stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>'
        +'<stop offset="30%" stop-color="'+col[0]+'" stop-opacity="0.95"/>'
        +'<stop offset="100%" stop-color="'+col[1]+'"/>'
        +'</radialGradient></defs>'
        +'<path d="M50 0C22.4 0 0 24.6 0 55C0 81 28 102 46 107L44 118H56L54 107C72 102 100 81 100 55C100 24.6 77.6 0 50 0Z" fill="url(#bg'+b+')"/>'
        +'<ellipse cx="33" cy="28" rx="10" ry="15" fill="white" fill-opacity="0.45" transform="rotate(-28 33 28)"/>'
        +'<path d="M50 118C48 124 53 128 50 135" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>'
        +'</svg>';
      L.appendChild(wrapper);
    }
  
    /* ---- Click confetti ---- */
    var cv=document.getElementById('click-confetti-canvas');
    var cx=cv.getContext('2d');
    var pts=[];var raf=null;
    function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
    resize();window.addEventListener('resize',resize);
    var CC=['#ff4d90','#ff85c2','#ff1a75','#ffb3d1','#ff69b4','#ffe0ee','#ff007f','#da3054','#ffd6e7','#c8bfff','#ffdc5e','#ff7295'];
    function spawn(x,y){
      for(var i=0;i<50;i++){
        var a=(Math.PI*2*i/50)+(Math.random()-0.5)*0.8;
        var sp=Math.random()*9+3;
        pts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-Math.random()*4,w:Math.random()*9+4,h:Math.random()*5+3,color:CC[Math.floor(Math.random()*CC.length)],rot:Math.random()*360,rs:(Math.random()-0.5)*14,op:1,heart:Math.random()<0.3});
      }
      if(!raf)loop();
    }
    function loop(){
      cx.clearRect(0,0,cv.width,cv.height);
      for(var i=pts.length-1;i>=0;i--){
        var p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.vx*=0.99;p.rot+=p.rs;p.op-=0.014;
        if(p.op<=0||p.y>cv.height+20){pts.splice(i,1);continue;}
        cx.save();cx.globalAlpha=Math.max(0,p.op);cx.translate(p.x,p.y);cx.rotate(p.rot*Math.PI/180);cx.fillStyle=p.color;
        if(p.heart){cx.font=(p.w*1.8)+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('\u2665',0,0);}
        else{cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
        cx.restore();
      }
      if(pts.length>0){raf=requestAnimationFrame(loop);}else{raf=null;}
    }
    document.addEventListener('click',function(e){spawn(e.clientX,e.clientY);});
    document.addEventListener('touchstart',function(e){for(var t=0;t<e.touches.length;t++)spawn(e.touches[t].clientX,e.touches[t].clientY);},{passive:true});
  })();
  </script>
  <main class="h-[100dvh] overflow-hidden flex flex-col items-center px-4 pt-[15px] pb-2 relative z-10 w-full">
    <section class="w-full max-w-[440px] flex flex-col items-center text-center z-10 h-full justify-start">
      <h1 class="font-display text-3xl leading-tight text-pink-500 drop-shadow-md">For my beautiful Messu 🌷</h1>
      <p class="mt-1 text-sm leading-6 text-pink-100/80 drop-shadow">Every little part of you makes my world more beautiful.</p>

      <!-- Pill Container -->
      <div class="flex items-center justify-center gap-4 mt-3 p-2 rounded-full bg-pink-100/20 backdrop-blur-md shadow-[0_4px_20px_rgba(255,100,150,0.15)] border border-pink-300/20">
        <!-- Button 1 -->
        <button class="reason-tab w-[72px] h-[72px] rounded-full bg-white overflow-hidden shadow-[0_0_15px_rgba(255,255,255,0.4)] ring-2 ring-pink-400 transition-all duration-300" data-index="0" aria-label="Your Warm Heart">
          <img src="messu1.jpeg" alt="Messu 1" class="w-full h-full object-cover">
        </button>
        <!-- Button 2 -->
        <button class="reason-tab w-[72px] h-[72px] rounded-full bg-white/20 overflow-hidden opacity-60 hover:opacity-100 transition-all duration-300 ring-0 hover:ring-2 ring-pink-400" data-index="1" aria-label="Your Gentle Smile">
          <img src="messu2.jpeg" alt="Messu 2" class="w-full h-full object-cover">
        </button>
        <!-- Button 3 -->
        <button class="reason-tab w-[72px] h-[72px] rounded-full bg-white/20 overflow-hidden opacity-60 hover:opacity-100 transition-all duration-300 ring-0 hover:ring-2 ring-pink-400" data-index="2" aria-label="My Constant Inspiration">
          <img src="messu3.jpeg" alt="Messu 3" class="w-full h-full object-cover">
        </button>
      </div>

      <div class="w-full mt-4 rounded-[2rem] bg-white/10 backdrop-blur-md text-left p-4 sm:p-6 shadow-[0_16px_36px_-6px_rgba(201,24,74,0.35)] border border-white/20" id="reason-card">
        <h2 class="text-lg sm:text-xl font-bold text-pink-300" id="reason-heading">Your Warm Heart</h2>
        <p class="mt-2 font-display italic leading-6 sm:leading-7 text-white/90 text-sm sm:text-base" id="reason-body">&quot;Your infinite kindness, gentle nature, and the deep warmth you bring into my life every single day.&quot;</p>
      </div>

      <div class="relative mt-4 flex-1 min-h-[120px] max-h-[220px] w-[80%] rounded-2xl overflow-hidden bg-pink-100 p-2 shadow-[0_18px_38px_-10px_rgba(201,24,74,0.45)]">
        <img class="w-full h-full object-cover rounded-xl" alt="A bouquet of pink tulips for Messu" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9Qrd5ldBHjZtZBLNavU6Upqs171SRYywVyifjOyVJwc-UhBlB3v_LFkfvh7BA2t4PAhribyHf2aV60dzu1KLEUenhSwCgnv_U7J-UOHxzMaOIgTsgxGEpum1P-ncIZ7F7j_wpQRX1j4tHKwA6e1g-ufAO2LOAna5Hm2nAJ51nxtO0yc_r0h2kMuDha63QsyFKSdoy35kIzRQp2zNxsjVlDY6LPzwNKBdjWyCfUnQ3tm7j3KrpiRLDOQ">
      </div>

      <div class="w-full px-2 mt-[60px] mb-2 flex justify-center z-50">
        <button class="w-full max-w-[340px] h-[55px] rounded-full bg-primary text-white text-lg font-bold shadow-[0_12px_28px_-4px_rgba(182,14,61,0.55)]" onclick="ptNavigate('a_letter_carrying_all_my_love.html')">Continue to My Letter 💌</button>
      </div>
    </section>
  </main>

  <script>
    const reasons = [
      ['Your Warm Heart', '"Your infinite kindness, gentle nature, and the deep warmth you bring into my life every single day."'],
      ['Your Gentle Smile', '"Your laughter lights up every room and turns even cloudy mornings into sunshine."'],
      ['My Constant Inspiration', '"Your quiet strength and brilliant heart inspire me every day."']
    ];
    document.querySelectorAll('.reason-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        const [heading, body] = reasons[Number(tab.dataset.index)];
        document.getElementById('reason-heading').textContent = heading;
        document.getElementById('reason-body').textContent = body;
        
        // Update active states
        document.querySelectorAll('.reason-tab').forEach(t => {
          t.classList.remove('bg-white', 'shadow-[0_0_15px_rgba(255,255,255,0.4)]', 'ring-2', 'ring-pink-400');
          t.classList.add('bg-white/20', 'opacity-60', 'ring-0');
        });
        tab.classList.remove('bg-white/20', 'opacity-60', 'ring-0');
        tab.classList.add('bg-white', 'shadow-[0_0_15px_rgba(255,255,255,0.4)]', 'ring-2', 'ring-pink-400');
      });
    });
  </script>
  <script src="transitions.js"></script>
  <script src="music.js"></script>
</body>
</html>
